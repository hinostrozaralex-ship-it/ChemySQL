name: ChemySQL CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js for frontend syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JS and ES modules
        run: |
          node --check frontend/er_canvas.js
          node --check frontend/relational_diagram.js
          node --check frontend/tutor_module.js
          node --check frontend/sql_editor.js
          node --input-type=module -e "globalThis.document = { addEventListener: () => {} }; globalThis.window = globalThis; await import('./frontend/app.js'); console.log('ESM_OK');"
